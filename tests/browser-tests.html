<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vintage Studio · 브라우저 통합 테스트</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #171a18; color: #edece3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1480px; padding: 24px; margin: auto; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { color: #b4b8af; line-height: 1.65; }
    code { font-size: .9em; }
    #summary { padding: 16px; border: 1px solid #59604d; border-radius: 10px; background: #252b21; font-weight: 700; }
    #summary.pass { border-color: #819860; background: #29351e; }
    #summary.fail { border-color: #d27c6b; background: #452d27; }
    .layout { display: grid; grid-template-columns: minmax(290px, 1fr) minmax(0, 980px); gap: 24px; margin-top: 20px; align-items: start; }
    ol { padding: 0; margin-top: 0; list-style: none; }
    li { padding: 13px; margin-bottom: 8px; background: #222720; border-radius: 8px; font-size: 13px; line-height: 1.5; }
    .label { font-weight: 750; margin-right: 8px; }
    li.pass .label { color: #dbe89a; }
    li.fail .label { color: #f9a291; }
    .detail { color: #aeb7a6; margin-top: 7px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; }
    li.fail .detail, #failures { color: #f7b8aa; }
    .preview { overflow: auto; padding: 8px; border: 1px solid #42493c; background: #0e110e; border-radius: 12px; }
    iframe { display: block; width: 960px; height: 820px; border: 0; background: #181b18; }
    .preview-note { font-size: 12px; }
    #failures { white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
    @media (max-width: 500px) { main { padding: 14px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <main>
    <h1>Vintage Studio 브라우저 통합 테스트</h1>
    <p>실제 앱의 사진 열기, 필터, 세부 조정, 편집 기록, 레시피, 비교, 내보내기 설정과 모바일 배치를 검사합니다.
      <code>index.html</code>과 같은 로컬 서버로 열어주세요. 사진 다운로드를 실행하지 않으며 테스트 전 즐겨찾기와 레시피는 종료 후 복원합니다.</p>
    <div id="summary" role="status" aria-live="polite">앱을 불러오는 중…</div>
    <div class="layout">
      <section aria-label="테스트 결과">
        <ol id="results"></ol>
        <pre id="failures" hidden></pre>
      </section>
      <section aria-label="실제 앱 미리보기">
        <div class="preview"><iframe id="appFrame" title="Vintage Studio 실제 앱" width="960" height="820"></iframe></div>
        <p class="preview-note" id="previewNote">데스크톱과 모바일 크기로 앱을 확인합니다.</p>
      </section>
    </div>
  </main>
  <script src="browser-tests.js"></script>
</body>
</html>
